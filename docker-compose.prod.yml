name: siavonga-run

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host on purpose — only reachable by other
    # containers on the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    # 3 workers — the instance moved from t3.micro (~1GB RAM) to
    # t3.small (~2GB RAM), so there's headroom for the Dockerfile's
    # original default again. Raise further only alongside another
    # instance size bump.
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60

  # The frontend deploys separately (e.g. Vercel) and talks to this
  # backend over a real cross-origin request, so CORS_ALLOWED_ORIGINS in
  # backend/.env must include its real domain.
  #
  # Caddy fronts the API on a single port — no domain and no DNS
  # required (see the Caddyfile). Only port 80 needs to be open in your
  # server's security group / firewall (443 too, once you add HTTPS).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  static_files:
  media_files:
  caddy_data:
  caddy_config:
